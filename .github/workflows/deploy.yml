name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # آپلود خروجی dist/ روی هاست.
      # کلیدها در Settings → Secrets and variables → Actions تعریف می‌شوند:
      #   FTP_SERVER    مثال: ftp.namadniroo.ir
      #   FTP_USERNAME  نام کاربری اکانت FTP مخصوص دیپلوی
      #   FTP_PASSWORD  رمز همان اکانت
      #   FTP_DIR       مسیر مقصد روی هاست، مثال: /public_html/
      #
      # نکته: این اکشن یک فایل وضعیت روی سرور نگه می‌دارد و فقط فایل‌هایی را
      # مدیریت می‌کند که خودش آپلود کرده. بنابراین فایل‌هایی که سمت سرور ساخته
      # می‌شوند (مثل .htpasswd محافظت پوشهٔ admin) دست‌نخورده می‌مانند.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htpasswd
