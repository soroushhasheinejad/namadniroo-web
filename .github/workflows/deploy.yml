name: Deploy to Liara

# با هر push روی main، سایت روی لیارا منتشر می‌شود.
# دلیل استفاده از گیت‌هاب به‌جای اجرای liara deploy روی سیستم شخصی:
# آپلود از ایران کند است و اتصال وسط کار قطع می‌شود؛ رانر گیت‌هاب
# اینترنت سریع دارد و این محدودیت را ندارد.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # بیلد و تست روی رانر، تا اگر کد خطا دارد
      # پیش از فرستادن به لیارا مشخص شود.
      - name: Install, test & build
        run: |
          npm ci
          npm test
          npm run build

      # توکن در Settings → Secrets and variables → Actions تعریف می‌شود
      # و هرگز داخل مخزن قرار نمی‌گیرد.
      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm install -g @liara/cli
          liara deploy \
            --app namadniroo \
            --platform node \
            --api-token "$LIARA_TOKEN" \
            --build-location iran \
            --no-app-logs \
            --message "deploy ${GITHUB_SHA::7} from GitHub Actions"

      # لیارا سازوکار healthCheck خودش را دارد، ولی روی این اپ نسخه‌های
      # کاملاً سالم را هم ناسالم اعلام می‌کرد و برمی‌گرداند. پس تأیید سلامت
      # اینجا انجام می‌شود: اگر نسخهٔ تازه بالا نیامده باشد یا دیتابیس و
      # دیسکش در دسترس نباشد، همین مرحله قرمز می‌شود و خبردار می‌شویم.
      - name: Verify the deployment is healthy
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 15 https://namadniroo.ir/health || true)
            case "$body" in
              *'"status":"ok"'*) echo "$body"; exit 0 ;;
            esac
            echo "هنوز آماده نیست (تلاش $i)"
            sleep 15
          done
          echo "نسخهٔ تازه سالم پاسخ نداد:"
          curl -s -m 15 https://namadniroo.ir/health || true
          exit 1
